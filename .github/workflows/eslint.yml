# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "28 18 * * 4"

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create ESLint config if missing
        run: |
          if [ ! -f .eslintrc.js ] && [ ! -f .eslintrc.json ] && [ ! -f .eslintrc.yml ]; then
            echo 'module.exports = {
              env: {
                browser: true,
                es2021: true,
                node: true
              },
              extends: ["eslint:recommended"],
              parserOptions: {
                ecmaVersion: "latest",
                sourceType: "module"
              },
              ignorePatterns: [
                "node_modules/",
                "dist/",
                "build/"
              ]
            }' > .eslintrc.js
          fi

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          npx eslint . \
            --config .eslintrc.js \
            --ext .js,.jsx,.ts,.tsx \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif
        continue-on-error: true

      - name: Check SARIF file
        run: |
          if [ ! -f eslint-results.sarif ]; then
            echo "ESLint SARIF file was not created"
            exit 1
          fi
          echo "ESLint SARIF file created successfully"
          ls -lh eslint-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
