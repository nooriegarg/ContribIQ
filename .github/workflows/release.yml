name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open changelog PR
        if: hashFiles('CHANGELOG.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only open a PR if semantic-release actually updated the changelog
          if ! git diff --quiet CHANGELOG.md; then
            VERSION=$(git tag --sort=-creatordate | head -1)
            BRANCH="chore/changelog-${VERSION}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add CHANGELOG.md
            git commit -m "chore(release): update changelog for ${VERSION} [skip ci]"
            git push origin "$BRANCH"
            # Ensure the changelog label exists before attaching it to the PR
            gh label create "changelog" --color "0075ca" --description "Automated changelog update" 2>/dev/null || true
            gh pr create \
              --title "chore(release): update changelog for ${VERSION}" \
              --body "Automated changelog update generated by semantic-release for release \`${VERSION}\`." \
              --base main \
              --head "$BRANCH" \
              --label "changelog"
          fi
