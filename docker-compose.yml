services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contribiq}
      POSTGRES_USER: ${POSTGRES_USER:-contribiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contribiq}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: taskiq worker backend.worker.broker:broker --tasks backend.worker.tasks
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
